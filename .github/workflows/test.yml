name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s mission-spec/scripts -p "test_*.py"
      - run: python -m unittest discover -s mission-csv-execute/scripts -p "test_*.py"
      - run: python -m unittest discover -s config-fragments -p "test_*.py"
